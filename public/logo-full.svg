<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Truck Icon -->
  <g transform="translate(10, 20)">
    <!-- Truck body -->
    <rect x="5" y="10" width="30" height="18" rx="2" fill="url(#logoGrad)"/>
    <!-- Truck cabin -->
    <rect x="32" y="13" width="15" height="15" rx="1.5" fill="url(#logoGrad)"/>
    <rect x="35" y="16" width="5" height="5" fill="#ffffff" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="15" cy="30" r="5" fill="#1a1d20" stroke="#0d6efd" stroke-width="1.5"/>
    <circle cx="15" cy="30" r="2.5" fill="#0d6efd"/>
    <circle cx="40" cy="30" r="5" fill="#1a1d20" stroke="#0d6efd" stroke-width="1.5"/>
    <circle cx="40" cy="30" r="2.5" fill="#0d6efd"/>
    <!-- Box -->
    <path d="M 12 15 L 15 13 L 23 13 L 26 15 L 23 17 L 15 17 Z" fill="#ffffff" opacity="0.9"/>
    <line x1="19" y1="13" x2="19" y2="17" stroke="#0d6efd" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="70" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
    Reloca<tspan fill="#0dcaf0">X</tspan>
  </text>
  <text x="72" y="52" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">
    Move With Joy
  </text>
</svg>
