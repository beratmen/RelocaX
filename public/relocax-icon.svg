<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Truck body -->
  <rect x="15" y="35" width="50" height="30" rx="3" fill="url(#grad1)"/>
  
  <!-- Truck cabin -->
  <rect x="60" y="40" width="25" height="25" rx="2" fill="url(#grad1)"/>
  <rect x="65" y="45" width="8" height="8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Wheels -->
  <circle cx="30" cy="68" r="8" fill="#1a1d20" stroke="#0d6efd" stroke-width="2"/>
  <circle cx="30" cy="68" r="4" fill="#0d6efd"/>
  <circle cx="70" cy="68" r="8" fill="#1a1d20" stroke="#0d6efd" stroke-width="2"/>
  <circle cx="70" cy="68" r="4" fill="#0d6efd"/>
  
  <!-- Box/package symbol -->
  <path d="M 35 45 L 40 42 L 50 42 L 55 45 L 50 48 L 40 48 Z" fill="#ffffff" opacity="0.9"/>
  <line x1="45" y1="42" x2="45" y2="48" stroke="#0d6efd" stroke-width="1.5"/>
  <line x1="40" y1="48" x2="40" y2="55" stroke="#ffffff" stroke-width="1"/>
  <line x1="50" y1="48" x2="50" y2="55" stroke="#ffffff" stroke-width="1"/>
  <line x1="40" y1="55" x2="50" y2="55" stroke="#ffffff" stroke-width="1"/>
</svg>
